[project]
name = "codesentinai"
version = "0.1.0"
description = "Developer-centric code auditing CLI tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "instructor>=1.3.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "python-dotenv>=1.0.1",
    "ollama>=0.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
autoreview = "autoreview.cli:app"
codesentinai = "autoreview.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/autoreview"]
